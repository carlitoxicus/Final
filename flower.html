<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti 🌼</title>

<link rel="stylesheet" href="./css/main.css">

<style>
/* BOTÓN INICIO */
#playBtn {
  position: absolute;
  top: 20px;
  left: 20px;
  z-index: 999;
  padding: 12px 20px;
  background: rgba(0,0,0,0.7);
  color: white;
  border: none;
  border-radius: 15px;
  font-size: 14px;
}

/* LETRAS */
#lyrics {
  position: absolute;
  bottom: 20%;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 24px;
  opacity: 0;
  transition: opacity 0.5s;
}

/* FONDO */
body {
  margin: 0;
  overflow: hidden;
  background: radial-gradient(circle, #0b1d3a, #000);
}

/* ESTRELLAS */
.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  border-radius: 50%;
  animation: twinkle 3s infinite;
}

@keyframes twinkle {
  0%,100% { opacity: 0.3 }
  50% { opacity: 1 }
}

/* COMETAS */
.comet {
  position: absolute;
  width: 3px;
  height: 3px;
  background: white;
  box-shadow: 0 0 20px white;
  animation: shoot linear infinite;
}

.comet::after {
  content: "";
  position: absolute;
  width: 150px;
  height: 2px;
  background: linear-gradient(90deg, white, transparent);
}

@keyframes shoot {
  0% { transform: translate(-100px, -100px); }
  100% { transform: translate(120vw, 120vh); }
}
</style>
</head>

<body>

<!-- BOTÓN -->
<button id="playBtn">🌼 Iniciar</button>

<!-- LETRAS -->
<div id="lyrics"></div>

<!-- AUDIO -->
<audio id="audio" src="./sound/Flor.mp3"></audio>

<!-- CONTENEDOR -->
<div id="scene"></div>

<!-- SCRIPT PRINCIPAL -->
<script src="./anim.js"></script>

<script>
const audio = document.getElementById("audio");

/* 🔊 INICIAR TODO */
document.getElementById("playBtn").addEventListener("click", () => {
  audio.play();
  document.getElementById("playBtn").style.display = "none";
});

/* ⭐ ESTRELLAS */
for (let i = 0; i < 100; i++) {
  let s = document.createElement("div");
  s.className = "star";
  s.style.left = Math.random() * 100 + "vw";
  s.style.top = Math.random() * 100 + "vh";
  document.body.appendChild(s);
}

/* ☄️ COMETAS */
function createComet() {
  let c = document.createElement("div");
  c.className = "comet";

  c.style.left = Math.random() * 100 + "vw";
  c.style.top = "-50px";
  c.style.animationDuration = (3 + Math.random() * 5) + "s";

  document.body.appendChild(c);

  setTimeout(() => c.remove(), 8000);
}

setInterval(createComet, 2000);

/* 🌼 FLORES MANZANILLA */
function createFlower(x) {
  let f = document.createElement("div");
  f.style.position = "absolute";
  f.style.bottom = "0";
  f.style.left = x + "vw";

  let stem = document.createElement("div");
  stem.style.width = "5px";
  stem.style.height = "200px";
  stem.style.background = "green";
  stem.style.margin = "auto";

  let center = document.createElement("div");
  center.style.width = "30px";
  center.style.height = "30px";
  center.style.background = "gold";
  center.style.borderRadius = "50%";
  center.style.position = "relative";
  center.style.top = "-15px";
  center.style.left = "-12px";

  f.appendChild(stem);
  f.appendChild(center);

  for (let i = 0; i < 10; i++) {
    let p = document.createElement("div");
    p.style.width = "20px";
    p.style.height = "40px";
    p.style.background = "white";
    p.style.borderRadius = "50%";
    p.style.position = "absolute";
    p.style.top = "-40px";
    p.style.left = "-7px";
    p.style.transform = `rotate(${i * 36}deg)`;

    center.appendChild(p);
  }

  document.body.appendChild(f);
}

/* varias flores */
for (let i = 0; i < 8; i++) {
  createFlower(10 + i * 10);
}
</script>

</body>
</html>
